# AI TEXT MINING SERVICE DEV (ai-services, branch dev-text-mining, directory text-mining-service): CI on GitHub Actions,
# deploy on Jenkins (CD-only job ai-text-mining-service-dev-cd).
#
#   GitHub Actions (build + image by digest)  ->  ai-text-mining-service-dev-cd (Jenkins: verify + legacy Lambda update)  ->  AWS Lambda
#
# Why (owner decision, 2026-11-18): the legacy job ai-text-mining-service-dev (devops
# PIPES/MICROSERVICES/ai-services-mining/dev/Jenkinsfile) runs
# `docker build` on the Jenkins agent. The build moves here (Docker runs on the GitHub runner); Jenkins keeps the legacy
# deploy (SSH to the microservices server, `aws lambda update-function-code --image-uri`) with the image referenced
# by its verified digest instead of the mutable tag `latest`, and no longer needs Docker. The legacy job is not changed
# and stays available in Jenkins for manual recovery (jenkins-trigger-ai-text-mining-dev.yml, workflow_dispatch only).
#
# Triggers: push to dev-text-mining (the service DEV branch) and workflow_dispatch. No pull_request trigger: the build
# reads the DEV secret, which is never given to pull request code. On other branches (this file reaches main-text-mining
# and beyond through the normal merges) the push filter never matches: the file is inert there.
#
# Build (the legacy stage Startup, unchanged): the legacy secret is written to text-mining-service/.env (CR removed), then
# the ORIGINAL Dockerfile is built in text-mining-service/ (`docker build .`) without AWS credentials. The legacy job runs
# no lint and no tests (none added).
# The job names are part of the Jenkins contract (stage "Verify CI Run"): `CI script checks (bash -n, ShellCheck)` and
# `publish image (text-mining)`. Rename them only together with the Jenkinsfile.
#
# Slack (Reporting Tool format, title AI-TEXT-MINING SERVICE NEW ENVIRONMENT, label DEV as the legacy messages):
#   started     this workflow, at the start of the run (no `needs`)
#   failed      this workflow, when the run failed BEFORE Jenkins accepted the request
#   succeeded / failed (deploy)   Jenkins ai-text-mining-service-dev-cd
#   SLACK_NOTIFICATIONS_WEBHOOK_URL (organization secret). Without it the notification is skipped with a warning.
#
# GitHub Environment text-mining-dev (publish and hand-over): deployment branch dev-text-mining only; administrators
# cannot bypass it.
#   Variables: CICD_BOUND_REF (refs/heads/dev-text-mining), CICD_AWS_REGION, CICD_ECR_REPOSITORY (mining-microservice-dev).
#   Secrets: CICD_BUILD_ROLE_ARN, CICD_ENV_SECRET_ID (the legacy secret id, unchanged). They are identifiers, not
#   credentials; they are secrets only so GitHub masks them in these public logs.
#   The build role trusts only this repository, the environment text-mining-dev and the ref refs/heads/dev-text-mining;
#   it can read only that secret and push only to mining-microservice-dev (no Lambda permission: the deploy stays in
#   Jenkins).
#   Repository secrets JENKINS_USERNAME / JENKINS_API_TOKEN (the same as the Jenkins triggers).
#
# Secret handling (only the service .env, as in the Jenkins job):
#   * OIDC with `output-env-credentials: false`: credentials are never exported to the job; only the secret-read step
#     and the push step receive them, through their own `env:`.
#   * The AWS CLI writes the secret straight to the git-ignored text-mining-service/.env; its values are also registered as
#     log masks. Never echoed, never an output, never uploaded, never cached; the file is removed by an `if: always()`
#     step. No `set -x`.
#   * The docker build runs through .github/scripts/without-oidc.sh: no AWS credential and no OIDC request variable.
#   * As today, the Dockerfile copies .env into the image (known risk, unchanged by this migration).
#
# Action pinning: every `uses:` is a full commit SHA (same SHAs as the other migrated pipelines):
#   actions/checkout                       v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   aws-actions/configure-aws-credentials  v6.3.0  e1253824e5c10ff9df46874f81ed3ec929e19cfd
# The local reusable workflows (./.github/workflows/*.reusable.yml) run from this same commit.
name: text-mining-dev-cicd

on:
  push:
    branches: [dev-text-mining]
  workflow_dispatch:

permissions: {}

concurrency:
  group: text-mining-dev-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- start notification
  notify-start:
    name: notify start (Slack)
    permissions: {}
    uses: ./.github/workflows/slack-notify.reusable.yml
    with:
      status: started
      title: AI-TEXT-MINING SERVICE NEW ENVIRONMENT
      project: AI-TEXT-MINING SERVICE
      environment-label: DEV
    secrets:
      SLACK_NOTIFICATIONS_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_WEBHOOK_URL }}

  # ---------------------------------------------------------------- mandatory checks
  # The legacy job runs no lint and no tests (none added). Only the CI scripts are checked.
  ci-script-checks:
    name: CI script checks (bash -n, ShellCheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax
        run: |
          for f in .github/scripts/*.sh; do bash -n "$f"; done
      - name: ShellCheck (preinstalled on the runner)
        run: shellcheck --severity=warning .github/scripts/*.sh

  # ---------------------------------------------------------------- build + publish
  publish-image:
    name: publish image (text-mining)
    needs: ci-script-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: text-mining-dev
    permissions:
      id-token: write
      contents: read
    env:
      DOCKER_BUILDKIT: '1'
      LOCAL_IMAGE: local/text-mining:${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Enforce bound ref
        env:
          BOUND_REF: ${{ vars.CICD_BOUND_REF }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          if [ -z "${BOUND_REF:-}" ] || [ "$CURRENT_REF" != "$BOUND_REF" ]; then echo "::error::ref is not the bound ref (fail closed)"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assume the build role through OIDC for the secret read (credentials not exported to the job)
        id: aws-config
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CICD_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.CICD_AWS_REGION }}
          role-session-name: text-mining-dev-ci-${{ github.run_id }}
          mask-aws-account-id: true
          output-env-credentials: false
          output-credentials: true
      - name: Text mining .env from Secrets Manager (git-ignored file, as the legacy job)
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-config.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-config.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-config.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.CICD_AWS_REGION }}
          SECRET_ID: ${{ secrets.CICD_ENV_SECRET_ID }}
        run: bash .github/scripts/write-text-mining-env.sh
      # Original Dockerfile and build context, as `dir('text-mining-service') { docker build -t ai-text-mining-service-dev:<n> . }`
      # in the legacy job; only the provenance labels checked by Jenkins (stage "Verify Image") are added.
      - name: Build image (original Dockerfile)
        working-directory: text-mining-service
        run: >-
          bash ../.github/scripts/without-oidc.sh docker build
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          --label "org.cgiar.cicd.run=${{ github.run_id }}-${{ github.run_attempt }}"
          --label org.cgiar.cicd.unit=text-mining
          --tag "$LOCAL_IMAGE" .
      - name: Remove the text mining .env
        if: always()
        run: bash .github/scripts/remove-text-mining-env.sh
      - name: Assume the build role through OIDC for the push (credentials not exported to the job)
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CICD_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.CICD_AWS_REGION }}
          role-session-name: text-mining-dev-ci-${{ github.run_id }}
          mask-aws-account-id: true
          output-env-credentials: false
          output-credentials: true
      - name: Push image and capture its digest
        id: push
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.CICD_AWS_REGION }}
          REPOSITORY: ${{ vars.CICD_ECR_REPOSITORY }}
          LOCAL: ${{ env.LOCAL_IMAGE }}
          TAG: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/scripts/push-image.sh

  # ---------------------------------------------------------------- CD hand-over to Jenkins
  deploy:
    name: deploy (Jenkins ai-text-mining-service-dev-cd)
    needs: publish-image
    if: needs.publish-image.result == 'success' && needs.publish-image.outputs.digest != ''
    permissions: {}
    uses: ./.github/workflows/jenkins-cd.reusable.yml
    with:
      jenkins-job: ai-text-mining-service-dev-cd
      environment: text-mining-dev
      dry-run: false # real deploy from the first run (as the other migrated pipelines); true = validation only
      artifacts: text-mining=${{ needs.publish-image.outputs.digest }}
    secrets:
      JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
      JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}

  # ---------------------------------------------------------------- CI failure notification
  notify-ci-failure:
    name: notify CI failure (Slack)
    needs: [ci-script-checks, publish-image, deploy]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions: {}
    uses: ./.github/workflows/slack-notify.reusable.yml
    with:
      status: failed
      title: AI-TEXT-MINING SERVICE NEW ENVIRONMENT
      project: AI-TEXT-MINING SERVICE
      environment-label: DEV
      detail: >-
        ci-script-checks=${{ needs.ci-script-checks.result }},
        publish-image=${{ needs.publish-image.result }},
        jenkins-hand-over=${{ needs.deploy.result }}
    secrets:
      SLACK_NOTIFICATIONS_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_WEBHOOK_URL }}
