name: Trigger Jenkins Job AI Text Mining Microservice

# Cutover (owner decision, 2026-11-18): pushes to dev-text-mining are built by text-mining-dev-cicd.yml and deployed by
# the Jenkins CD-only job ai-text-mining-service-dev-cd. The push trigger of the legacy job ai-text-mining-service-dev is
# removed; workflow_dispatch stays for manual recovery with the legacy job.
on:
  workflow_dispatch:

jobs:
  trigger-job:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Build Jenkins URL
      - name: Build Jenkins URL
        run: |
          JENKINS_URL="https://automation.prms.cgiar.org/job/ai-text-mining-service-dev/build"
          echo "Jenkins job URL: $JENKINS_URL"
          echo "JENKINS_URL=${JENKINS_URL}" >> $GITHUB_ENV

      # Step 2: Trigger Jenkins Job
      - name: Trigger Jenkins Job
        run: |
          curl -X POST ${{ env.JENKINS_URL }} --user ${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }}
        env:
          JENKINS_URL: ${{ env.JENKINS_URL }}
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
