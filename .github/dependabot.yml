version: 2
updates:
  - package-ecosystem: npm
    directory: /text-mining-service/frontend
    target-branch: dev-text-mining
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: [next, 'eslint-config-next', '@next/*', '@opennextjs/aws']
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
